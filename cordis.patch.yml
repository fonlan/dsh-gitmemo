# dsh-gitmemo — bundle patch layer.
#
# Installing this package into a profile (`dsh plugin --profile <name> add @fonlan/dsh-gitmemo`)
# appends it to `dsh.profile.bundles`; this patch is then applied as that
# bundle's layer. The row below loads the package's main entry as a host-plane
# plugin: at every ROOT-agent creation it scopes the
# `mem_search` / `mem_read` / `mem_write` / `mem_delete` / `mem_replace`
# tools plus the memory workflow system-prompt section into that agent
# (subagents get neither). No session-start scanning, no Git I/O at
# registration time.
#
# `memDirName` / `branchAlign` / `recentContextLimit` are deprecated and kept
# only for one compatibility version (they are parsed but have no effect;
# `.mem` is fixed at <projectRoot>/.mem and always stays on main).
- insert:
    - id: dsh-gitmemo
      # Node-resolvable package name — must stay in sync with package.json
      # `name`. Quoted because `@` is a reserved indicator in YAML and cannot
      # open a plain scalar.
      name: '@fonlan/dsh-gitmemo'
      config:
        memDirName: .mem
        searchLimit: 20
        lockTimeoutMs: 30000
